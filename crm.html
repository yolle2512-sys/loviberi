<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЛОВИ БЕРИ — CRM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f1e9;
      color: #222;
    }

    /* ВХОД */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 24px;
      padding: 42px 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      color: #a7193f;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 35px;
    }

    .login-card h2 {
      margin-bottom: 10px;
    }

    .login-card p {
      color: #777;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin-top: 15px;
      outline: none;
    }

    input:focus {
      border-color: #a7193f;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #a7193f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      opacity: 0.92;
    }

    #loginError {
      color: #b42318;
      margin-top: 15px;
      display: none;
    }

    /* CRM */

    #crmScreen {
      display: none;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .header {
      margin-bottom: 32px;
    }

    .header h1 {
      margin: 0;
      color: #a7193f;
      font-size: 36px;
    }

    .header p {
      color: #777;
      margin-top: 8px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 32px;
    }

    .stat {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }

    .stat-label {
      color: #777;
      font-size: 14px;
      text-transform: uppercase;
    }

    .stat-value {
      color: #a7193f;
      font-size: 34px;
      font-weight: bold;
      margin-top: 8px;
    }

    .panel {
      background: white;
      border-radius: 22px;
      padding: 26px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.04);
      overflow-x: auto;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel-header h2 {
      margin: 0;
    }

    .refresh {
      width: auto;
      margin: 0;
      padding: 13px 22px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      text-align: left;
      padding: 16px 12px;
      border-bottom: 1px solid #eee;
    }

    th {
      color: #777;
      font-size: 14px;
    }

    .status {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
    }

    .visited {
      background: #e5f5e9;
      color: #16803c;
    }

    .not-visited {
      background: #f3f3f3;
      color: #777;
    }

    #loading {
      padding: 30px;
      text-align: center;
      color: #777;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .header h1 {
        font-size: 30px;
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- ЭКРАН ВХОДА -->

  <div id="loginScreen">

    <div class="login-card">

      <div class="logo">ЛОВИ БЕРИ</div>
      <div class="subtitle">CRM мероприятия</div>

      <h2>Вход для администратора</h2>

      <p>
        Введите пароль для просмотра списка гостей
      </p>

      <input
        id="password"
        type="password"
        placeholder="Пароль"
        autocomplete="current-password"
      >

      <button id="loginButton">
        ВОЙТИ В CRM
      </button>

      <div id="loginError">
        Неверный пароль
      </div>

    </div>

  </div>


  <!-- CRM -->

  <div id="crmScreen">

    <div class="container">

      <div class="header">
        <h1>ЛОВИ БЕРИ</h1>
        <p>CRM мероприятия</p>
      </div>


      <div class="stats">

        <div class="stat">
          <div class="stat-label">Зарегистрировано</div>
          <div class="stat-value" id="registered">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">Пришли</div>
          <div class="stat-value" id="visited">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">Не пришли</div>
          <div class="stat-value" id="notVisited">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">Конверсия в визит</div>
          <div class="stat-value" id="conversion">0%</div>
        </div>

      </div>


      <div class="panel">

        <div class="panel-header">

          <h2>Гости</h2>

          <button
            class="refresh"
            onclick="loadCRM()"
          >
            Обновить данные
          </button>

        </div>

        <div id="loading">
          Загружаем гостей...
        </div>

        <table id="guestTable" style="display:none;">

          <thead>
            <tr>
              <th>Имя</th>
              <th>Код</th>
              <th>Статус</th>
              <th>Регистрация</th>
              <th>Вход</th>
            </tr>
          </thead>

          <tbody id="guestRows"></tbody>

        </table>

      </div>

    </div>

  </div>


<script>

let crmPassword = "";


/* ВХОД */

async function login() {

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("loginError");

  error.style.display = "none";

  try {

    const response = await fetch("/api/login", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        password: password
      })

    });

    if (!response.ok) {

      error.style.display = "block";
      return;

    }

    crmPassword = password;

    document.getElementById("loginScreen").style.display =
      "none";

    document.getElementById("crmScreen").style.display =
      "block";

    loadCRM();

  } catch (e) {

    error.textContent =
      "Ошибка соединения с сервером";

    error.style.display =
      "block";

  }

}


/* ЗАГРУЗКА CRM */

async function loadCRM() {

  const loading =
    document.getElementById("loading");

  const table =
    document.getElementById("guestTable");

  loading.style.display = "block";
  table.style.display = "none";

  try {

    const response = await fetch("/api/crm", {

      headers: {
        "x-crm-password": crmPassword
      }

    });

    if (!response.ok) {

      loading.textContent =
        "Не удалось загрузить данные";

      return;

    }

    const data = await response.json();

    const guests =
      data.guests || data.tickets || [];

    renderCRM(guests);

    loading.style.display = "none";
    table.style.display = "table";

  } catch (e) {

    loading.textContent =
      "Ошибка загрузки CRM";

  }

}


/* ОТРИСОВКА */

function renderCRM(guests) {

  const rows =
    document.getElementById("guestRows");

  rows.innerHTML = "";

  let visited = 0;

  guests.forEach(function(guest) {

    const came =
      guest.used === true ||
      guest.visited === true ||
      guest.status === "used";

    if (came) visited++;


    const tr =
      document.createElement("tr");


    const name =
      guest.name ||
      guest.first_name ||
      "Гость";


    const code =
      guest.code ||
      guest.ticket ||
      "—";


    const registered =
      formatDate(
        guest.createdAt ||
        guest.created_at ||
        guest.registeredAt
      );


    const entered =
      formatDate(
        guest.usedAt ||
        guest.used_at ||
        guest.visitedAt
      );


    tr.innerHTML = `

      <td><strong>${escapeHtml(name)}</strong></td>

      <td>${escapeHtml(code)}</td>

      <td>

        <span class="status ${came ? "visited" : "not-visited"}">

          ${came ? "Пришёл" : "Не пришёл"}

        </span>

      </td>

      <td>${registered}</td>

      <td>${came ? entered : "—"}</td>

    `;

    rows.appendChild(tr);

  });


  const total =
    guests.length;

  const notVisited =
    total - visited;

  const conversion =
    total > 0
      ? Math.round((visited / total) * 100)
      : 0;


  document.getElementById("registered").textContent =
    total;

  document.getElementById("visited").textContent =
    visited;

  document.getElementById("notVisited").textContent =
    notVisited;

  document.getElementById("conversion").textContent =
    conversion + "%";

}


/* ДАТЫ */

function formatDate(value) {

  if (!value) return "—";

  try {

    return new Date(value).toLocaleString(
      "ru-RU",
      {
        dateStyle: "short",
        timeStyle: "short"
      }
    );

  } catch {

    return value;

  }

}


/* БЕЗОПАСНЫЙ ВЫВОД ТЕКСТА */

function escapeHtml(value) {

  return String(value)

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* КНОПКА ВХОДА */

document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    login
  );


/* ENTER */

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        login();
      }

    }
  );

</script>

</body>
</html>
