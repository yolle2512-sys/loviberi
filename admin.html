<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЛОВИ БЕРИ — вход</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f8f1e9;
  margin:0;
}
.box{
  max-width:480px;
  margin:40px auto;
  padding:24px;
}
.card{
  background:#fff;
  border-radius:22px;
  padding:24px;
  box-shadow:0 8px 30px #0001;
}
h1{
  text-align:center;
  color:#7b2034;
}
input{
  width:100%;
  padding:16px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:20px;
  box-sizing:border-box;
}
.btn{
  width:100%;
  margin-top:14px;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#7b2034;
  color:#fff;
  font-weight:700;
  font-size:17px;
  cursor:pointer;
}
.result{
  margin-top:18px;
  padding:16px;
  border-radius:12px;
  text-align:center;
  font-size:17px;
  display:none;
}
</style>
</head>

<body>

<div class="box">
  <div class="card">

    <h1>ЛОВИ БЕРИ</h1>

    <p>Проверка билета на входе</p>

    <input
      id="code"
      placeholder="LOVI-1234"
      autocomplete="off"
    >

    <button
      id="verifyButton"
      class="btn"
      type="button">
      ПРОВЕРИТЬ БИЛЕТ
    </button>

    <div id="result" class="result"></div>

  </div>
</div>

<script>
const button = document.getElementById('verifyButton');

button.addEventListener('click', async function () {

  const code = document
    .getElementById('code')
    .value
    .trim()
    .toUpperCase();

  const result = document.getElementById('result');

  result.style.display = 'block';

  if (!code) {
    result.textContent = 'Введите код билета';
    result.style.background = '#fdecec';
    return;
  }

  result.textContent = 'Проверяем...';
  result.style.background = '#f3f3f3';

  try {

    const response = await fetch('/api/verify', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ code: code })
    });

    const data = await response.json();

    result.textContent =
      data.message || data.error || 'Готово';

    if (response.ok) {
      result.style.background = '#e8f5e9';
    } else {
      result.style.background = '#fdecec';
    }

  } catch (error) {

    result.textContent =
      'Не удалось связаться с сервером';

    result.style.background = '#fdecec';

  }

});
</script>

</body>
</html>
